name: test

on:
  pull_request:
  push:
    branches: [llteacher01]

jobs:
  web:
    name: apps/web — typecheck, migrate, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: llteacher
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: llteacher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llteacher -d llteacher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://llteacher:dev@localhost:5432/llteacher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ephemeral, generated per run -- not repo secrets. The seed script's
      # encrypted output never needs to survive past this job (the DB is
      # torn down with the runner), so there's nothing to lose by not
      # persisting these, and it removes both the "add two repo secrets
      # before CI goes green" step and the fork-PR failure mode (secrets
      # aren't available to fork PR runs by default).
      - name: Generate ephemeral seed encryption keys
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BLIND_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply Postgres extensions
        run: psql "$DATABASE_URL" -f apps/web/src/db/init/01_extensions.sql

      - name: Apply Drizzle migrations
        working-directory: apps/web
        run: npm run db:migrate

      - name: Seed smoke test
        working-directory: apps/web
        run: npm run db:seed -- --reset

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
