name: release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Immutable image tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    if: >-
      (inputs.environment == 'staging' && github.ref == 'refs/heads/staging') ||
      (inputs.environment == 'production' && startsWith(github.ref, 'refs/tags/'))
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_REGION: us-east-1
      STACK: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: pulumi/actions@v6
        with:
          command: version
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: docker/setup-buildx-action@v3
      - name: Install and build
        run: npm ci && npm run build --workspace=infra
      - name: Preview infrastructure
        run: pulumi -C infra preview --stack "$STACK" --non-interactive
      - name: Build and publish application image
        id: image
        run: |
          repository=$(pulumi -C infra stack output ecrRepositoryUrl --stack "$STACK")
          aws ecr get-login-password | docker login --username AWS --password-stdin "${repository%%/*}"
          echo "tag=$repository:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.aws
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=llteacher-aws
          cache-to: type=gha,mode=max,scope=llteacher-aws
      - name: Register the new revision without starting it
        run: |
          pulumi -C infra config set --stack "$STACK" imageTag "$IMAGE_TAG"
          pulumi -C infra config set --stack "$STACK" deployApp false
          pulumi -C infra up --stack "$STACK" --yes --non-interactive
      - name: Run migrations before service update
        run: ./infra/scripts/run-aws-migrations.sh "$STACK"
      - name: Start the migrated service and check HTTPS
        run: |
          pulumi -C infra config set --stack "$STACK" deployApp true
          pulumi -C infra up --stack "$STACK" --yes --non-interactive
          aws ecs wait services-stable --cluster "llteacher-$STACK-cluster" --services "llteacher-$STACK-app"
          app_url=$(pulumi -C infra stack output appUrl --stack "$STACK")
          curl --fail --retry 12 --retry-delay 5 "$app_url/api/health"
